<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="doghoney_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9248"/>
      <stop offset="60%" stop-color="#FF6A1A"/>
      <stop offset="100%" stop-color="#E04800"/>
    </linearGradient>
    <filter id="drop_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#doghoney_bg)"/>

  <!-- Subtle Inner Glow Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Main Delivery Truck & Trunk Shape -->
  <g filter="url(#drop_shadow)" fill="#FFFFFF">
    <!-- Cargo Box / Trunk -->
    <path d="M96 160C96 142.327 110.327 128 128 128H296C309.255 128 320 138.745 320 152V320H128C110.327 320 96 305.673 96 288V160Z"/>
    <!-- Truck Cabin -->
    <path d="M328 176C328 162.745 338.745 152 352 152H376C388.423 152 400.126 157.733 407.711 167.534L443.711 214.068C449.124 221.07 452 229.626 452 238.401V296C452 309.255 441.255 320 428 320H328V176Z"/>
  </g>

  <!-- Cabin Window (Dark Accent) -->
  <path d="M344 176H372C380.282 176 388.084 179.822 393.14 186.35L421.14 222.35C424.254 226.368 426 231.293 426 236.35V248H344V176Z" fill="#D9480F"/>

  <!-- Cute Carrot / Honey Badge Accent on Cargo -->
  <g transform="translate(170, 180) scale(1.4)">
    <path d="M22 6C23.1 3.8 26.2 3.8 27.3 6L30.5 12.5C31.6 14.7 30 17.3 27.5 17.3H21.8C19.3 17.3 17.7 14.7 18.8 12.5L22 6Z" fill="#38B000"/>
    <path d="M24.7 14L14 36C12.5 39 15.5 42.5 18.8 41L34.5 33C37.5 31.5 37 27 33.8 25.5L24.7 14Z" fill="#FFB703"/>
    <path d="M22 19L16 32" stroke="#E85D04" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M26 23L21 34" stroke="#E85D04" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wheels -->
  <!-- Left Wheel -->
  <circle cx="180" cy="344" r="52" fill="#1E293B"/>
  <circle cx="180" cy="344" r="28" fill="#F8FAFC"/>
  <circle cx="180" cy="344" r="14" fill="#FF6A1A"/>

  <!-- Right Wheel -->
  <circle cx="380" cy="344" r="52" fill="#1E293B"/>
  <circle cx="380" cy="344" r="28" fill="#F8FAFC"/>
  <circle cx="380" cy="344" r="14" fill="#FF6A1A"/>

  <!-- "개꿀" text badge pill at bottom -->
  <rect x="156" y="416" width="200" height="60" rx="30" fill="#FFFFFF" filter="url(#drop_shadow)"/>
  <text x="256" y="458" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="34" fill="#FF6A1A" letter-spacing="-1">개꿀</text>
</svg>
